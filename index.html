<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MediLens AR - Smart Medication Assistant</title>
    <meta name="description"
        content="Immersive AR medication safety assistant designed for Meta Quest 3S to aid users with smart pill identification and voice guidance.">

    <!-- A-Frame WebXR Engine -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <style>
        /* Global Styling & Strict 5-Color System Palette */
        /* Colors: Blue (#3b82f6), Green (#22c55e), Red (#ef4444), Orange (#f97316), White (#ffffff) */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #090d16;
            color: #ffffff;
            user-select: none;
        }

        /* 2D HUD Control Panel Overlay */
        #hud-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 9999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 340px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #hud-overlay.hidden-hud {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .brand-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: #3b82f6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
        }

        .brand-subtitle {
            font-size: 11px;
            color: #ffffff;
            opacity: 0.7;
            margin: 2px 0 0 0;
            font-weight: 500;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #22c55e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 8px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .demo-controls-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #ffffff;
            opacity: 0.7;
            margin: 10px 0 6px 0;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .demo-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            text-align: left;
        }

        .demo-btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .demo-btn.correct:hover {
            background: #22c55e;
            border-color: #22c55e;
        }

        .demo-btn.wrong:hover {
            background: #ef4444;
            border-color: #ef4444;
        }

        .demo-btn.expired:hover {
            background: #ef4444;
            border-color: #ef4444;
        }

        .demo-btn.reminder:hover {
            background: #f97316;
            border-color: #f97316;
        }

        /* Toggle Mode Floating Button */
        #hud-toggle-trigger {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10000;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        #hud-toggle-trigger:hover {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        /* Voice Speech Animation Bar */
        #voice-speaking-indicator {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #3b82f6;
            border-radius: 30px;
            padding: 10px 24px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        .soundwave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 18px;
        }

        .soundwave span {
            width: 4px;
            height: 100%;
            background-color: #3b82f6;
            border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite;
        }

        .soundwave span:nth-child(2) { animation-delay: 0.15s; }
        .soundwave span:nth-child(3) { animation-delay: 0.3s; }
        .soundwave span:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 18px; }
        }
    </style>

    <script>
        // ==========================================
        // PROCEDURAL TEXTURE GENERATORS (5-COLOR PALETTE)
        // ==========================================

        function createCanvasTexture(width, height, drawFn) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            drawFn(ctx, width, height);
            return canvas.toDataURL('image/png');
        }

        const amlodipineTexture = createCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(30, 30, w - 60, 80);

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 36px sans-serif';
            ctx.fillText('AMLODIPINE 5mg', 50, 82);

            ctx.fillStyle = '#090d16';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('Rx #94012 • Morning Schedule', 50, 155);
            ctx.fillText('Take 1 Tablet After Breakfast', 50, 190);

            ctx.fillStyle = '#22c55e';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('✓ VALID EXPIRY: Oct 2027', 50, 230);

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 4; col++) {
                    const px = 85 + col * 100;
                    const py = 295 + row * 70;
                    ctx.beginPath();
                    ctx.arc(px, py, 24, 0, Math.PI * 2);
                    ctx.fillStyle = '#3b82f6';
                    ctx.fill();
                }
            }
        });

        const metforminTexture = createCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(0, 0, w, 90);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px sans-serif';
            ctx.fillText('NIGHTTIME DOSE ONLY', 25, 58);

            ctx.fillStyle = '#090d16';
            ctx.font = '900 44px sans-serif';
            ctx.fillText('METFORMIN', 25, 160);
            ctx.fillStyle = '#3b82f6';
            ctx.font = 'bold 36px sans-serif';
            ctx.fillText('500 mg Tablet', 25, 205);

            ctx.fillStyle = '#090d16';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('Schedule: NIGHT (9:00 PM)', 25, 270);

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(20, 340, w - 40, 85);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('⚠ DO NOT TAKE IN MORNING!', 35, 390);
        });

        const amoxicillinTexture = createCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = '#ef4444';
            ctx.fillRect(0, 30, w, 75);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText('❌ EXPIRED MEDICINE ❌', 40, 80);

            ctx.fillStyle = '#090d16';
            ctx.font = '900 38px sans-serif';
            ctx.fillText('AMOXICILLIN 250mg', 40, 160);

            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('EXP DATE: Jan 2024 (EXPIRED)', 40, 220);

            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 14;
            ctx.beginPath(); ctx.moveTo(30, 260); ctx.lineTo(w - 30, h - 30); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(w - 30, 260); ctx.lineTo(30, h - 30); ctx.stroke();
        });

        const atorvastatinTexture = createCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = '#f97316';
            ctx.fillRect(0, 0, w, 80);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px sans-serif';
            ctx.fillText('UPCOMING EVENING MED', 25, 52);

            ctx.fillStyle = '#090d16';
            ctx.font = '900 38px sans-serif';
            ctx.fillText('ATORVASTATIN', 25, 150);
            ctx.fillStyle = '#3b82f6';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText('10 mg Tablet', 25, 195);

            ctx.fillStyle = '#090d16';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('Scheduled: 9:00 PM Tonight', 25, 270);
            ctx.fillText('EXP: Aug 2027 (Valid)', 25, 310);
        });

        const prescriptionTexture = createCanvasTexture(1024, 768, (ctx, w, h) => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 8;
            ctx.strokeRect(20, 20, w - 40, h - 40);

            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(40, 40, w - 80, 90);

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 36px sans-serif';
            ctx.fillText('MediLens™ Prescription Record', 70, 98);

            ctx.fillStyle = '#090d16';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText('Patient Name: Eleanor Vance', 70, 180);
            ctx.fillText('Schedule: Morning Dose Active (9:00 AM)', 70, 220);

            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(70, 250); ctx.lineTo(w - 70, 250); ctx.stroke();

            ctx.fillStyle = '#22c55e';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText('✓ Morning: Amlodipine 5mg', 90, 310);

            ctx.fillStyle = '#090d16';
            ctx.font = 'bold 24px sans-serif';
            ctx.fillText('○ Afternoon: Vitamin', 90, 370);
            ctx.fillText('○ Night: Metformin 500mg, Atorvastatin 10mg', 90, 430);
        });

        function updateClockCanvasTexture(timeStr) {
            return createCanvasTexture(512, 256, (ctx, w, h) => {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, w, h);

                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 6;
                ctx.strokeRect(10, 10, w - 20, h - 20);

                ctx.fillStyle = '#3b82f6';
                ctx.font = '900 64px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(timeStr, w / 2, 110);

                ctx.fillStyle = '#22c55e';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('MORNING DOSAGE TIME', w / 2, 175);
            });
        }
    </script>

    <script>
        // ==========================================
        // VOICE SPEECH ASSISTANT ENGINE
        // ==========================================
        const VoiceAssistant = {
            speaking: false,
            speak: function (text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.88;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                const indicator = document.getElementById('voice-speaking-indicator');
                const textElem = document.getElementById('voice-text');

                utterance.onstart = () => {
                    this.speaking = true;
                    if (indicator) {
                        indicator.style.display = 'flex';
                        if (textElem) textElem.textContent = 'Voice Guidance Speaking...';
                    }
                };

                utterance.onend = utterance.onerror = () => {
                    this.speaking = false;
                    if (indicator) indicator.style.display = 'none';
                };

                window.speechSynthesis.speak(utterance);
            }
        };

        // ==========================================
        // A-FRAME CUSTOM COMPONENTS
        // ==========================================

        AFRAME.registerComponent('medicine-item', {
            schema: {
                idKey: { type: 'string' },
                name: { type: 'string' },
                dosage: { type: 'string' },
                instructions: { type: 'string' },
                expiry: { type: 'string' },
                statusType: { type: 'string', default: 'correct' },
                statusText: { type: 'string' },
                voiceScript: { type: 'string' }
            },

            init: function () {
                const el = this.el;
                this.originalPosition = el.getAttribute('position') || { x: 0, y: 0, z: 0 };
                this.originalY = this.originalPosition.y;
                
                // Find label and ring inside parent group
                const parent = el.parentElement;
                this.labelEl = parent ? parent.querySelector('.med-label') : null;
                this.ringEl = parent ? parent.querySelector('.med-ring') : null;

                el.addEventListener('mouseenter', () => {
                    // Lift bottle by 2 cm (0.02m), brighten ring, enlarge label slightly
                    el.setAttribute('animation__lift', {
                        property: 'position',
                        to: `${this.originalPosition.x} ${this.originalY + 0.02} ${this.originalPosition.z}`,
                        dur: 150,
                        easing: 'easeOutQuad'
                    });

                    if (this.labelEl) {
                        this.labelEl.setAttribute('animation__scale', {
                            property: 'scale',
                            to: '1.15 1.15 1.15',
                            dur: 150,
                            easing: 'easeOutQuad'
                        });
                    }

                    if (this.ringEl) {
                        this.ringEl.setAttribute('material', 'opacity', 1.0);
                    }
                });

                el.addEventListener('mouseleave', () => {
                    el.setAttribute('animation__lift', {
                        property: 'position',
                        to: `${this.originalPosition.x} ${this.originalY} ${this.originalPosition.z}`,
                        dur: 150,
                        easing: 'easeOutQuad'
                    });

                    if (this.labelEl) {
                        this.labelEl.setAttribute('animation__scale', {
                            property: 'scale',
                            to: '1.0 1.0 1.0',
                            dur: 150,
                            easing: 'easeOutQuad'
                        });
                    }

                    if (this.ringEl) {
                        this.ringEl.setAttribute('material', 'opacity', 0.6);
                    }
                });

                el.addEventListener('click', () => {
                    this.triggerScan();
                });
            },

            triggerScan: function () {
                const sceneEl = this.el.sceneEl;
                const arCardComp = sceneEl.components['ar-card-display'];
                
                // Display medicine name after scanning
                if (this.labelEl && this.data.name) {
                    this.labelEl.setAttribute('value', this.data.name);
                    this.labelEl.setAttribute('width', '1.4');
                }

                if (arCardComp) {
                    arCardComp.showCard(this.data, this.el);
                }

                if (this.data.voiceScript) {
                    VoiceAssistant.speak(this.data.voiceScript);
                }
            }
        });

        AFRAME.registerComponent('ar-card-display', {
            init: function () {
                this.cardContainer = document.querySelector('#ar-floating-card');
                this.headerPlane = document.querySelector('#card-header-plane');
                this.statusText = document.querySelector('#card-status-text');

                this.nameText = document.querySelector('#card-name-text');
                this.dosageText = document.querySelector('#card-dosage-text');
                this.expiryText = document.querySelector('#card-expiry-text');

                this.voiceBtn = document.querySelector('#card-voice-btn');
                this.confirmBtn = document.querySelector('#card-confirm-btn');
                this.closeBtn = document.querySelector('#card-close-btn');

                this.currentData = null;

                const handleConfirm = (evt) => {
                    if (evt) evt.stopPropagation();
                    if (this.currentData && this.currentData.statusType === 'correct') {
                        VoiceAssistant.speak("Dose confirmed! Good job following your morning medication schedule.");
                        const schedHeader = document.querySelector('#sched-morning-header');
                        const schedSub = document.querySelector('#sched-morning-sub');
                        if (schedHeader) schedHeader.setAttribute('value', '✓ MORNING (TAKEN)');
                        if (schedSub) {
                            schedSub.setAttribute('value', 'Amlodipine 5mg (Taken)');
                            schedSub.setAttribute('color', '#22c55e');
                        }
                    } else {
                        VoiceAssistant.speak("Action recorded.");
                    }
                    this.hideCard();
                };

                const handleClose = (evt) => {
                    if (evt) evt.stopPropagation();
                    this.hideCard();
                };

                const handleVoice = (evt) => {
                    if (evt) evt.stopPropagation();
                    if (this.currentData && this.currentData.voiceScript) {
                        VoiceAssistant.speak(this.currentData.voiceScript);
                    }
                };

                // Bind click events on button geometry & child elements for 100% click reliability
                if (this.confirmBtn) {
                    this.confirmBtn.addEventListener('click', handleConfirm);
                    this.confirmBtn.querySelectorAll('*').forEach(c => c.addEventListener('click', handleConfirm));
                }

                if (this.closeBtn) {
                    this.closeBtn.addEventListener('click', handleClose);
                    this.closeBtn.querySelectorAll('*').forEach(c => c.addEventListener('click', handleClose));
                }

                if (this.voiceBtn) {
                    this.voiceBtn.addEventListener('click', handleVoice);
                    this.voiceBtn.querySelectorAll('*').forEach(c => c.addEventListener('click', handleVoice));
                }

                // Add Hover Effects on Buttons
                [this.confirmBtn, this.closeBtn, this.voiceBtn].forEach(btn => {
                    if (!btn) return;
                    btn.addEventListener('mouseenter', () => {
                        btn.setAttribute('animation__scale', { property: 'scale', to: '1.08 1.08 1.08', dur: 100, easing: 'easeOutQuad' });
                    });
                    btn.addEventListener('mouseleave', () => {
                        btn.setAttribute('animation__scale', { property: 'scale', to: '1.0 1.0 1.0', dur: 100, easing: 'easeOutQuad' });
                    });
                });
            },

            hideCard: function() {
                if (this.cardContainer) {
                    this.cardContainer.setAttribute('visible', 'false');
                }
            },

            showCard: function (data, targetEl) {
                this.currentData = data;

                // 5-Color System Header Palette
                let headerColor = '#22c55e'; // Green (Correct)
                if (data.statusType === 'wrong' || data.statusType === 'expired') headerColor = '#ef4444'; // Red (Error)
                if (data.statusType === 'scheduled') headerColor = '#f97316'; // Orange (Reminder)

                this.headerPlane.setAttribute('color', headerColor);
                this.statusText.setAttribute('value', data.statusText);

                // Clean layout: Name, Dosage & Instructions, Expiry
                this.nameText.setAttribute('value', data.name);
                this.dosageText.setAttribute('value', `${data.dosage}  |  ${data.instructions}`);
                this.expiryText.setAttribute('value', data.expiry);

                // Position floating card clearly in front
                this.cardContainer.setAttribute('position', '0 1.45 -0.85');
                this.cardContainer.setAttribute('visible', 'true');

                this.cardContainer.setAttribute('animation__fade', {
                    property: 'scale',
                    from: '0.01 0.01 0.01',
                    to: '1 1 1',
                    dur: 250,
                    easing: 'easeOutBack'
                });
            }
        });

        AFRAME.registerComponent('medilens-app', {
            init: function () {
                document.querySelector('#amlodipine-strip').setAttribute('material', `src: ${amlodipineTexture}; roughness: 0.3; metalness: 0.3;`);
                document.querySelector('#metformin-bottle').setAttribute('material', `src: ${metforminTexture}; roughness: 0.4;`);
                document.querySelector('#amoxicillin-strip').setAttribute('material', `src: ${amoxicillinTexture}; roughness: 0.3; metalness: 0.3;`);
                document.querySelector('#atorvastatin-bottle').setAttribute('material', `src: ${atorvastatinTexture}; roughness: 0.4;`);
                document.querySelector('#prescription-plane').setAttribute('material', `src: ${prescriptionTexture}; roughness: 0.8;`);

                this.clockPlane = document.querySelector('#digital-clock-plane');
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
            },

            updateClock: function () {
                const timeStr = `09:00 AM`;
                if (this.clockPlane) {
                    const clockTex = updateClockCanvasTexture(timeStr);
                    this.clockPlane.setAttribute('material', `src: ${clockTex}; shader: flat;`);
                }
            }
        });

        function triggerDemoScan(idKey) {
            const elem = document.querySelector(`[data-med-id="${idKey}"]`);
            if (elem && elem.components['medicine-item']) {
                elem.components['medicine-item'].triggerScan();
            }
        }

        // Toggle HUD Presentation Mode
        function toggleHud() {
            const hud = document.getElementById('hud-overlay');
            const btn = document.getElementById('hud-toggle-trigger');
            if (hud.classList.contains('hidden-hud')) {
                hud.classList.remove('hidden-hud');
                btn.textContent = '👁️ Presentation Mode';
            } else {
                hud.classList.add('hidden-hud');
                btn.textContent = '👁️ Demo Controls';
            }
        }
    </script>
</head>

<body>

    <!-- HUD Toggle Button -->
    <button id="hud-toggle-trigger" onclick="toggleHud()">👁️ Presentation Mode</button>

    <!-- 2D HUD OVERLAY -->
    <div id="hud-overlay">
        <div class="hud-card">
            <div class="brand-header">
                <div class="brand-header-left">
                    <div class="brand-logo">👁️</div>
                    <div>
                        <h1 class="brand-title">MediLens AR</h1>
                        <p class="brand-subtitle">Smart Medication Assistant</p>
                    </div>
                </div>
            </div>
            <div class="status-badge">
                <div class="pulse-dot"></div>
                <span>Morning Schedule Active (9:00 AM)</span>
            </div>

            <div class="demo-controls-title">Demo Controls</div>
            <div class="btn-group">
                <button class="demo-btn correct" onclick="triggerDemoScan('amlodipine')">
                    <span>✓ Amlodipine 5mg</span>
                    <small>(Correct Med)</small>
                </button>
                <button class="demo-btn wrong" onclick="triggerDemoScan('metformin')">
                    <span>⚠ Metformin 500mg</span>
                    <small>(Wrong Med)</small>
                </button>
                <button class="demo-btn expired" onclick="triggerDemoScan('amoxicillin')">
                    <span>❌ Amoxicillin 250mg</span>
                    <small>(Expired Med)</small>
                </button>
                <button class="demo-btn reminder" onclick="triggerDemoScan('atorvastatin')">
                    <span>⏰ Atorvastatin 10mg</span>
                    <small>(Tonight 9 PM)</small>
                </button>
            </div>
        </div>
    </div>

    <!-- Voice Audio Speaking Banner -->
    <div id="voice-speaking-indicator">
        <div class="soundwave">
            <span></span><span></span><span></span><span></span>
        </div>
        <span id="voice-text" style="font-weight:700; color:#3b82f6; font-size:14px;">Voice Guidance Speaking...</span>
    </div>

    <!-- A-FRAME WEBXR SCENE -->
    <a-scene medilens-app ar-card-display
        webxr="optionalFeatures: passthrough, hit-test, local-floor; referenceSpaceType: local-floor"
        renderer="colorManagement: true; antialias: true;" cursor="rayOrigin: mouse"
        raycaster="objects: .raycastable">

        <!-- LIGHTING SETUP -->
        <a-entity light="type: ambient; color: #ffffff; intensity: 1.1"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 1.8; castShadow: true;"
            position="-1.5 3.5 2"></a-entity>
        <a-entity light="type: point; color: #3b82f6; intensity: 0.5; distance: 5;" position="0 1.8 -0.5"></a-entity>

        <!-- CAMERA RIG WITH GAZE CURSOR -->
        <a-entity id="rig" position="0 0 0.8">
            <a-camera id="camera" look-controls="pointerLockEnabled: false" position="0 1.4 0">
                <a-cursor id="gaze-cursor"
                    cursor="fuse: false"
                    material="color: #3b82f6; shader: flat; opacity: 0.9"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012"
                    raycaster="objects: .raycastable">
                </a-cursor>
            </a-camera>

            <a-entity laser-controls="hand: right" raycaster="objects: .raycastable; far: 5; showLine: true"
                line="color: #3b82f6; opacity: 0.8">
            </a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .raycastable; far: 5; showLine: true"
                line="color: #3b82f6; opacity: 0.8">
            </a-entity>
        </a-entity>

        <!-- BACKGROUND AR/VR ROOM ENVIRONMENT -->
        <a-sky color="#090d16"></a-sky>
        <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#1e293b"
            shadow="receive: true" material="roughness: 0.9"></a-plane>

        <!-- REALISTIC TABLETOP -->
        <a-entity id="tabletop-group" position="0 0.75 -0.8">
            <a-box id="desk" position="0 -0.04 0" width="1.6" height="0.08" depth="0.9" color="#475569"
                shadow="receive: true" material="roughness: 0.3; metalness: 0.1">
            </a-box>
            <a-cylinder position="-0.7 -0.42 -0.38" radius="0.03" height="0.76" color="#1e293b"></a-cylinder>
            <a-cylinder position="0.7 -0.42 -0.38" radius="0.03" height="0.76" color="#1e293b"></a-cylinder>
            <a-cylinder position="-0.7 -0.42 0.38" radius="0.03" height="0.76" color="#1e293b"></a-cylinder>
            <a-cylinder position="0.7 -0.42 0.38" radius="0.03" height="0.76" color="#1e293b"></a-cylinder>


            <!-- ========================================== -->
            <!-- MEDICINE OBJECT 1: AMLODIPINE 5mg (X: -0.55) -->
            <!-- ========================================== -->
            <a-entity id="amlodipine-group" position="-0.55 0.02 0.05" rotation="0 15 0">
                <a-box id="amlodipine-strip" data-med-id="amlodipine" class="raycastable" width="0.22" height="0.02"
                    depth="0.14" shadow="cast: true" medicine-item="
                        idKey: amlodipine;
                        name: Amlodipine 5mg;
                        dosage: 1 tablet;
                        instructions: After breakfast;
                        expiry: Expiry: Oct 2027;
                        statusType: correct;
                        statusText: ✓ Correct Medicine;
                        voiceScript: Correct Medicine identified! Amlodipine 5 milligrams. Take 1 tablet now after breakfast for your blood pressure.
                    ">
                </a-box>

                <a-ring class="med-ring" position="0 0.015 0" rotation="-90 0 0" radius-inner="0.12" radius-outer="0.135" color="#22c55e"
                    material="shader: flat; opacity: 0.6"></a-ring>

                <a-text class="med-label" value="✓ Correct Medicine" position="0 0.28 0" align="center" width="1.4"
                    color="#22c55e" material="shader: flat; depthTest: false">
                </a-text>
            </a-entity>


            <!-- ========================================== -->
            <!-- MEDICINE OBJECT 2: METFORMIN 500mg (X: -0.20) -->
            <!-- ========================================== -->
            <a-entity id="metformin-group" position="-0.20 0.08 -0.15" rotation="0 -10 0">
                <a-cylinder id="metformin-bottle" data-med-id="metformin" class="raycastable" radius="0.05"
                    height="0.14" color="#ffffff" shadow="cast: true" medicine-item="
                        idKey: metformin;
                        name: Metformin 500mg;
                        dosage: 1 tablet;
                        instructions: Nighttime (9:00 PM);
                        expiry: Expiry: Dec 2026;
                        statusType: wrong;
                        statusText: ⚠ Wrong Medicine;
                        voiceScript: Warning! Wrong Medicine scanned. Metformin is scheduled for Nighttime. Please take Amlodipine 5mg instead.
                    ">
                    <a-cylinder position="0 0.075 0" radius="0.052" height="0.025" color="#ef4444"></a-cylinder>
                </a-cylinder>

                <a-ring class="med-ring" position="0 0.005 0" rotation="-90 0 0" radius-inner="0.07" radius-outer="0.085" color="#ef4444"
                    material="shader: flat; opacity: 0.6"></a-ring>

                <a-text class="med-label" value="⚠ Wrong Medicine" position="0 0.28 0" align="center" width="1.4"
                    color="#ef4444" material="shader: flat; depthTest: false">
                </a-text>
            </a-entity>


            <!-- ========================================== -->
            <!-- MEDICINE OBJECT 3: AMOXICILLIN 250mg (X: 0.20) -->
            <!-- ========================================== -->
            <a-entity id="amoxicillin-group" position="0.20 0.02 0.1" rotation="0 -25 0">
                <a-box id="amoxicillin-strip" data-med-id="amoxicillin" class="raycastable" width="0.2" height="0.02"
                    depth="0.13" shadow="cast: true" medicine-item="
                        idKey: amoxicillin;
                        name: Amoxicillin 250mg;
                        dosage: Discard & do not take;
                        instructions: Expired medicine;
                        expiry: Expiry: Expired Jan 2024;
                        statusType: expired;
                        statusText: ❌ Expired;
                        voiceScript: Danger! Medicine Expired! This Amoxicillin expired in January 2024. Do not swallow expired medication.
                    ">
                </a-box>

                <a-ring class="med-ring" position="0 0.01 0" rotation="-90 0 0" radius-inner="0.11" radius-outer="0.125" color="#ef4444"
                    material="shader: flat; opacity: 0.6"></a-ring>

                <a-text class="med-label" value="❌ Expired" position="0 0.28 0" align="center" width="1.4"
                    color="#ef4444" material="shader: flat; depthTest: false">
                </a-text>
            </a-entity>


            <!-- ========================================== -->
            <!-- MEDICINE OBJECT 4: ATORVASTATIN 10mg (X: 0.55) -->
            <!-- ========================================== -->
            <a-entity id="atorvastatin-group" position="0.55 0.07 -0.12" rotation="0 20 0">
                <a-cylinder id="atorvastatin-bottle" data-med-id="atorvastatin" class="raycastable" radius="0.045"
                    height="0.13" color="#ffffff" shadow="cast: true" medicine-item="
                        idKey: atorvastatin;
                        name: Atorvastatin 10mg;
                        dosage: 1 tablet;
                        instructions: Scheduled for 9:00 PM;
                        expiry: Expiry: Aug 2027;
                        statusType: scheduled;
                        statusText: ⏰ Tonight 9 PM;
                        voiceScript: Reminder! Atorvastatin 10 milligrams is scheduled for 9:00 PM tonight. You do not need to take it now.
                    ">
                    <a-cylinder position="0 0.07 0" radius="0.048" height="0.02" color="#3b82f6"></a-cylinder>
                </a-cylinder>

                <a-ring class="med-ring" position="0 0.005 0" rotation="-90 0 0" radius-inner="0.07" radius-outer="0.085" color="#f97316"
                    material="shader: flat; opacity: 0.6"></a-ring>

                <a-text class="med-label" value="⏰ Tonight 9 PM" position="0 0.28 0" align="center" width="1.4"
                    color="#f97316" material="shader: flat; depthTest: false">
                </a-text>
            </a-entity>


            <!-- SCENE PROPS: GLASS OF WATER -->
            <a-entity id="water-glass-group" position="-0.7 0.1 -0.2">
                <a-cylinder radius="0.045" height="0.14" color="#ffffff"
                    material="opacity: 0.35; transparent: true; roughness: 0.1; metalness: 0.8"></a-cylinder>
                <a-cylinder position="0 -0.015 0" radius="0.042" height="0.1" color="#3b82f6"
                    material="opacity: 0.6; transparent: true; roughness: 0.2"></a-cylinder>
            </a-entity>

            <!-- SCENE PROPS: PRESCRIPTION CARD DOCUMENT -->
            <a-plane id="prescription-plane" position="0 0.01 0.22" rotation="-90 0 0" width="0.38" height="0.28">
            </a-plane>

            <!-- SCENE PROPS: DIGITAL BEDSIDE CLOCK -->
            <a-entity id="clock-group" position="0 0.12 -0.32">
                <a-box width="0.32" height="0.15" depth="0.08" color="#090d16"></a-box>
                <a-plane id="digital-clock-plane" position="0 0 0.042" width="0.3" height="0.13"></a-plane>
            </a-entity>
        </a-entity>


        <!-- ========================================== -->
        <!-- SIMPLIFIED 3D FLOATING AR INFO CARD -->
        <!-- ========================================== -->
        <a-entity id="ar-floating-card" position="0 1.45 -0.85" visible="false">
            <!-- Glass Backdrop Panel -->
            <a-plane width="1.0" height="0.80" color="#090d16"
                material="opacity: 0.92; transparent: true; roughness: 0.2">
                <a-plane position="0 0 -0.005" width="1.02" height="0.82" color="#3b82f6"
                    material="opacity: 0.4;"></a-plane>
            </a-plane>

            <!-- Close Button Plane (X) -->
            <a-circle id="card-close-btn" class="raycastable" position="0.44 0.33 0.02" radius="0.04" color="#ef4444" material="shader: flat">
                <a-text value="X" position="0 0 0.01" align="center" width="1.6" color="#ffffff" material="shader: flat; depthTest: false"></a-text>
            </a-circle>

            <!-- Status Header Banner -->
            <a-plane id="card-header-plane" position="0 0.32 0.01" width="0.94" height="0.10" color="#22c55e">
                <a-text id="card-status-text" value="✓ Correct Medicine" position="0 0 0.01" align="center" width="1.6"
                    color="#ffffff" material="shader: flat; depthTest: false"></a-text>
            </a-plane>

            <!-- Medicine Name -->
            <a-text id="card-name-text" value="Amlodipine 5mg" position="0 0.18 0.01" align="center"
                width="1.8" color="#ffffff" material="shader: flat; depthTest: false"></a-text>

            <!-- Dosage & Instructions -->
            <a-text id="card-dosage-text" value="1 tablet  |  After breakfast" position="0 0.06 0.01" align="center" width="1.4"
                color="#ffffff" material="shader: flat; depthTest: false"></a-text>

            <!-- Expiry -->
            <a-text id="card-expiry-text" value="Expiry: Oct 2027" position="0 -0.05 0.01" align="center" width="1.3"
                color="#ffffff" material="shader: flat; depthTest: false"></a-text>

            <!-- Action Buttons: [Listen] & [Taken] -->
            <a-plane id="card-voice-btn" class="raycastable" position="-0.22 -0.24 0.02" width="0.38" height="0.09" color="#3b82f6" material="roughness: 0.3">
                <a-text value="🔊 Listen" position="0 0 0.01" align="center" width="1.5"
                    color="#ffffff" material="shader: flat; depthTest: false"></a-text>
            </a-plane>

            <a-plane id="card-confirm-btn" class="raycastable" position="0.22 -0.24 0.02" width="0.38" height="0.09" color="#22c55e" material="roughness: 0.3">
                <a-text value="✓ Taken" position="0 0 0.01" align="center" width="1.5"
                    color="#ffffff" material="shader: flat; depthTest: false"></a-text>
            </a-plane>
        </a-entity>


        <!-- ========================================== -->
        <!-- CLEAN SCHEDULE PANEL -->
        <!-- ========================================== -->
        <a-entity id="schedule-dashboard-panel" position="0.9 1.45 -0.85" rotation="0 -12 0">
            <!-- Glass Panel -->
            <a-plane width="0.60" height="0.80" color="#090d16" material="opacity: 0.90; transparent: true">
                <a-plane position="0 0 -0.005" width="0.62" height="0.82" color="#3b82f6"
                    material="opacity: 0.3"></a-plane>
            </a-plane>

            <!-- Title: TODAY -->
            <a-text value="TODAY" position="0 0.32 0.01" align="center" width="1.4"
                color="#ffffff" material="shader: flat; depthTest: false"></a-text>

            <a-plane position="0 0.26 0.01" width="0.50" height="0.003" color="#3b82f6"></a-plane>

            <!-- Morning -->
            <a-text id="sched-morning-header" value="✓ MORNING (9:00 AM)" position="-0.24 0.18 0.01" width="1.1" color="#22c55e" material="shader: flat; depthTest: false"></a-text>
            <a-text id="sched-morning-sub" value="Amlodipine 5mg" position="-0.24 0.11 0.01" width="0.9" color="#ffffff" material="shader: flat; depthTest: false"></a-text>

            <!-- Afternoon -->
            <a-text value="○ AFTERNOON (2:00 PM)" position="-0.24 -0.02 0.01" width="1.1" color="#ffffff" material="shader: flat; depthTest: false"></a-text>
            <a-text value="Multivitamin Senior" position="-0.24 -0.09 0.01" width="0.9" color="#ffffff" opacity="0.8" material="shader: flat; depthTest: false"></a-text>

            <!-- Night -->
            <a-text value="○ NIGHT (9:00 PM)" position="-0.24 -0.22 0.01" width="1.1" color="#ffffff" material="shader: flat; depthTest: false"></a-text>
            <a-text value="Metformin & Atorvastatin" position="-0.24 -0.29 0.01" width="0.9" color="#ffffff" opacity="0.8" material="shader: flat; depthTest: false"></a-text>
        </a-entity>

    </a-scene>

</body>

</html>
